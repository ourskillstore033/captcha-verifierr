<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Captcha Verifier Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.1);
  padding: 30px;
  border-radius: 20px;
  width: 380px;
  text-align: center;
  color: white;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}

h2 {
  margin-bottom: 5px;
}

.subtitle {
  font-size: 13px;
  color: #ccc;
  margin-bottom: 20px;
}

select, input {
  width: 100%;
  padding: 10px;
  margin-top: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
}

button {
  margin-top: 15px;
  padding: 12px;
  width: 100%;
  border-radius: 10px;
  border: none;
  background: #00c6ff;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #0072ff;
}

/* Slider captcha */
.slider-container {
  margin-top: 20px;
  background: #eee;
  border-radius: 30px;
  position: relative;
  height: 50px;
  display: none;
}

.slider-track {
  height: 100%;
  width: 0%;
  background: #4caf50;
  border-radius: 30px;
}

.slider-button {
  position: absolute;
  height: 50px;
  width: 50px;
  background: #fff;
  border-radius: 50%;
  top: 0;
  left: 0;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
}

canvas {
  margin-top: 15px;
  border-radius: 10px;
}

#mathBox {
  font-size: 22px;
  margin-top: 10px;
}

.popup {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 15px;
  border-radius: 10px;
  display: none;
}
</style>
</head>

<body>

<div class="container">

<h2>🔐 Captcha Verifier Pro</h2>
<div class="subtitle">Inspired by modern security systems</div>

<select id="captchaType" onchange="loadCaptcha()">
  <option value="text">Text Captcha</option>
  <option value="math">Math Captcha</option>
  <option value="slider">Slider Captcha</option>
</select>

<canvas id="captchaCanvas" width="220" height="70"></canvas>
<div id="mathBox"></div>

<!-- Slider -->
<div class="slider-container" id="sliderBox">
  <div class="slider-track" id="sliderTrack"></div>
  <div class="slider-button" id="sliderBtn">→</div>
</div>

<input id="userInput" placeholder="Enter captcha">

<button onclick="verifyCaptcha()">Verify</button>
<button onclick="loadCaptcha()">Refresh</button>

</div>

<div id="popup" class="popup"></div>

<script src="script.js"></script>

</body>
</html>
