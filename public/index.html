<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Captcha Verifier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      width: 360px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h2 {
      margin-bottom: 5px;
    }

    p {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }

    select, input {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #4facfe;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #00c6ff;
    }

    .refresh-btn {
      background: #eee;
      color: #333;
    }

    .refresh-btn:hover {
      background: #ddd;
    }

    canvas {
      margin-top: 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    #mathBox {
      margin-top: 15px;
      font-size: 22px;
      font-weight: bold;
      display: none;
    }

    .popup {
      position: fixed;
      top: 20px;
      right: 20px;
      color: white;
      padding: 15px 20px;
      border-radius: 10px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">

  <h2>🔐 Captcha Verifier</h2>
  <p>Complete the captcha to verify</p>

  <!-- Captcha type -->
  <select id="captchaType" onchange="loadCaptcha()">
    <option value="text">Text Captcha</option>
    <option value="math">Math Captcha</option>
  </select>

  <!-- Text captcha -->
  <canvas id="captchaCanvas" width="220" height="70"></canvas>

  <!-- Math captcha -->
  <div id="mathBox"></div>

  <!-- Input -->
  <input 
    type="text" 
    id="userInput" 
    placeholder="Enter captcha here"
  >

  <!-- Buttons -->
  <button onclick="verifyCaptcha()">Verify</button>
  <button class="refresh-btn" onclick="loadCaptcha()">Refresh Captcha</button>

</div>

<!-- Popup -->
<div id="popup" class="popup"></div>

<!-- Script -->
<script src="script.js"></script>

</body>
</html>
