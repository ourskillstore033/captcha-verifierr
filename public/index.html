<!DOCTYPE html>
<html>
<head>
<title>Captcha Verifier</title>
<link rel="stylesheet" href="style.css">

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>

<div class="card">

<h3>Verify</h3>

<select id="type" onchange="loadCaptcha()">
  <option value="text">Text</option>
  <option value="math">Math</option>
  <option value="image">Image</option>
</select>

<canvas id="canvas" width="220" height="70"></canvas>
<div id="mathBox"></div>

<div id="imageBox">
  <p id="q"></p>
  <div id="imageGrid"></div>
</div>

<input id="input" placeholder="Enter captcha">

<!-- Turnstile -->
<div class="cf-turnstile" data-sitekey="0x4AAAAAADKQ23d06Ga1yf3e"></div>

<button onclick="verify()">Verify</button>

</div>

<script src="script.js"></script>
</body>
</html>
