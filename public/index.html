<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Captcha Verifier</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  margin: 0;
  background: #f5f7fb;
  display: flex;
  height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 240px;
  background: #111827;
  color: white;
  padding: 20px;
}

.sidebar h2 {
  font-size: 18px;
  margin-bottom: 30px;
}

.sidebar p {
  font-size: 13px;
  color: #9ca3af;
}

/* Main */
.main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Card */
.card {
  width: 420px;
  background: white;
  border-radius: 14px;
  padding: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.card h3 {
  margin: 0;
}

.subtitle {
  font-size: 13px;
  color: #6b7280;
  margin-bottom: 20px;
}

/* Inputs */
select, input {
  width: 100%;
  padding: 10px;
  margin-top: 12px;
  border-radius: 8px;
  border: 1px solid #d1d5db;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  cursor: pointer;
  font-weight: 500;
}

button:hover {
  background: #1d4ed8;
}

/* Captcha box */
.captcha-box {
  margin-top: 15px;
  text-align: center;
}

canvas {
  border-radius: 8px;
  border: 1px solid #e5e7eb;
}

#mathBox {
  font-size: 22px;
  font-weight: 600;
}

/* Image grid */
#imageGrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

#imageGrid img {
  width: 100%;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
}

#imageGrid img.selected {
  border: 3px solid #2563eb;
}

/* Popup */
.popup {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 14px 18px;
  border-radius: 8px;
  color: white;
  display: none;
}

/* Footer badge */
.badge {
  margin-top: 20px;
  font-size: 12px;
  color: #9ca3af;
  text-align: center;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>🔐 Captcha</h2>
  <p>Verification system</p>
</div>

<div class="main">

<div class="card">

<h3>Verify you are human</h3>
<div class="subtitle">Complete the challenge below</div>

<select id="captchaType" onchange="loadCaptcha()">
  <option value="text">Text</option>
  <option value="math">Math</option>
  <option value="image">Image Select</option>
  <option value="slider">Slider</option>
  <option value="puzzle">Puzzle</option>
</select>

<div class="captcha-box">

  <canvas id="captchaCanvas" width="220" height="70"></canvas>

  <div id="mathBox" style="display:none;"></div>

  <div id="imageBox" style="display:none;">
    <p id="imageQuestion"></p>
    <div id="imageGrid"></div>
  </div>

  <div id="sliderBox" style="display:none;">
    <div class="slider-container">
      <div class="slider-track" id="sliderTrack"></div>
      <div class="slider-button" id="sliderBtn">→</div>
    </div>
  </div>

  <div id="puzzleBox" style="display:none;">
    <p>Slide to complete puzzle</p>
    <div class="slider-container">
      <div class="slider-track" id="puzzleTrack"></div>
      <div class="slider-button" id="puzzleBtn">⬛</div>
    </div>
  </div>

</div>

<input id="userInput" placeholder="Enter captcha">

<button onclick="verifyCaptcha()">Verify</button>
<button onclick="loadCaptcha()">Refresh</button>

<div class="badge">
  Secure verification • Demo system
</div>

</div>

</div>

<div id="popup" class="popup"></div>

<script src="script.js"></script>

</body>
</html>
